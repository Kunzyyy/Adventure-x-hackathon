*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;background:#0a0a14;color:#e2e8f0;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
#particle-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}

.glass-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top left, var(--glass-highlight), transparent 70%);pointer-events:none;}
.glass-card:hover{border-color:rgba(99,102,241,.3);box-shadow:0 8px 40px rgba(99,102,241,.1),inset 0 1px 0 rgba(255,255,255,.05);transform:translateY(-2px);}
.glow-btn{position:relative;overflow:hidden;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;color:#fff;font-weight:600;border-radius:14px;padding:14px 32px;cursor:pointer;transition:all .4s cubic-bezier(.25,.1,.25,1);box-shadow:0 0 30px rgba(99,102,241,.3);letter-spacing:.5px;}
.glow-btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 0 50px rgba(99,102,241,.5);}
.glow-btn-outline{position:relative;background:transparent;border:1.5px solid rgba(139,92,246,.5);color:#c4b5fd;font-weight:600;border-radius:14px;padding:14px 32px;cursor:pointer;transition:all .4s cubic-bezier(.25,.1,.25,1);letter-spacing:.5px;}
.glow-btn-outline:hover{border-color:#8b5cf6;box-shadow:0 0 30px rgba(139,92,246,.2);background:rgba(139,92,246,.1);transform:translateY(-2px);}
#three-canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;}
.notif-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px rgba(34,197,94,.5);}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(99,102,241,.3);border-radius:3px;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-20px);}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 20px rgba(99,102,241,.3);}50%{box-shadow:0 0 50px rgba(99,102,241,.6),0 0 100px rgba(139,92,246,.3);}}
@keyframes orbit{from{transform:rotate(0);}to{transform:rotate(360deg);}}
@keyframes particleRise{0%{transform:translateY(100vh) scale(0);opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{transform:translateY(-10vh) scale(1);opacity:0;}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
.fade-in-up{animation:fadeInUp .6s ease-out forwards;}
.fade-in-up-delay-1{animation:fadeInUp .6s .1s ease-out forwards;opacity:0;}
.fade-in-up-delay-2{animation:fadeInUp .6s .2s ease-out forwards;opacity:0;}
@media(max-width:768px){.glass-card{border-radius:16px;}.glow-btn{padding:12px 24px;font-size:14px;border-radius:12px;}}
</style>

<!-- ===== SCRIPTS ===== -->
<script>
// Particle System
class ParticleSystem {
  constructor(){this.canvas=document.getElementById('particle-canvas');this.ctx=this.canvas.getContext('2d');this.particles=[];this.resize();window.addEventListener('resize',()=>this.resize());this.init();this.animate();}
  resize(){this.canvas.width=window.innerWidth;this.canvas.height=window.innerHeight;}
  init(){for(let i=0;i<80;i++)this.particles.push({x:Math.random()*this.canvas.width,y:Math.random()*this.canvas.height,size:Math.random()*2+.5,speedY:Math.random()*.5+.1,speedX:(Math.random()-.5)*.3,opacity:Math.random()*.4+.1,pulse:Math.random()*Math.PI*2});}
  animate(){this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);this.particles.forEach(p=>{p.y-=p.speedY;p.x+=p.speedX;p.pulse+=.02;if(p.y<-10){p.y=this.canvas.height+10;p.x=Math.random()*this.canvas.width;}if(p.x<-10)p.x=this.canvas.width+10;if(p.x>this.canvas.width+10)p.x=-10;const a=p.opacity+Math.sin(p.pulse)*.15;this.ctx.beginPath();this.ctx.arc(p.x,p.y,p.size,0,Math.PI*2);this.ctx.fillStyle=`rgba(99,102,241,${Math.max(.05,a)})`;this.ctx.fill();this.ctx.beginPath();this.ctx.arc(p.x,p.y,p.size*3,0,Math.PI*2);this.ctx.fillStyle=`rgba(99,102,241,${Math.max(.01,a*.3)})`;this.ctx.fill();});requestAnimationFrame(()=>this.animate());}
}

// 3D Core (Three.js)
class ThreeCore {
  constructor(){
    this.container=document.getElementById('three-canvas');if(!this.container)return;
    this.scene=new THREE.Scene();
    this.camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,.1,1000);
    this.camera.position.z=12;
    this.renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
    this.renderer.setSize(window.innerWidth,window.innerHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    this.container.appendChild(this.renderer.domElement);
    this.core=null;this.orbitNodes=[];this.connections=[];
    this.mouseX=0;this.mouseY=0;
    this.init();this.animate();
    window.addEventListener('resize',()=>this.onResize());
    document.addEventListener('mousemove',(e)=>{this.mouseX=(e.clientX/window.innerWidth)*2-1;this.mouseY=-(e.clientY/window.innerHeight)*2+1;});
  }
  init(){
    const coreGeo=new THREE.IcosahedronGeometry(1.5,3);
    const coreMat=new THREE.MeshPhongMaterial({color:0x3b82f6,emissive:0x1e3a5f,shininess:100,wireframe:false,transparent:true,opacity:.9});
    this.core=new THREE.Mesh(coreGeo,coreMat);this.scene.add(this.core);
    const wireGeo=new THREE.IcosahedronGeometry(2.2,2);
    const wireMat=new THREE.MeshBasicMaterial({color:0x6366f1,wireframe:true,transparent:true,opacity:.15});
    this.scene.add(new THREE.Mesh(wireGeo,wireMat));
    const labels=['能力分析','简历生成','需求分析','岗位匹配'];
    const colors=[0x3b82f6,0x8b5cf6,0x06b6d4,0x6366f1];
    labels.forEach((l,i)=>{
      const a=(i/labels.length)*Math.PI*2;
      const n=new THREE.Mesh(new THREE.SphereGeometry(.25,16,16),new THREE.MeshPhongMaterial({color:colors[i],emissive:colors[i],emissiveIntensity:.5}));
      n.userData={angle:a,radius:4.5,speed:.3+i*.05,color:colors[i]};
      n.position.x=Math.cos(a)*n.userData.radius;n.position.y=Math.sin(a)*n.userData.radius;
      this.scene.add(n);this.orbitNodes.push(n);
      const r=new THREE.Mesh(new THREE.TorusGeometry(n.userData.radius,.02,16,100),new THREE.MeshBasicMaterial({color:colors[i],transparent:true,opacity:.2}));
      r.rotation.x=Math.PI/2;this.scene.add(r);
    });
    for(let i=0;i<60;i++){
      const p=new THREE.Mesh(new THREE.SphereGeometry(.03,4,4),new THREE.MeshBasicMaterial({color:0x6366f1,transparent:true,opacity:.6}));
      p.userData={orbitRadius:3+Math.random()*3,angle:Math.random()*Math.PI*2,speed:.2+Math.random()*.8,yOffset:(Math.random()-.5)*4};
      this.scene.add(p);this.connections.push(p);
    }
    this.scene.add(new THREE.AmbientLight(0x333366,.6));
    const pl=new THREE.PointLight(0x6366f1,1.5,20);pl.position.set(3,2,5);this.scene.add(pl);
    const pl2=new THREE.PointLight(0x8b5cf6,.8,15);pl2.position.set(-3,-1,3);this.scene.add(pl2);
  }
  animate(){
    requestAnimationFrame(()=>this.animate());const t=Date.now()*.001;
    if(this.core){this.core.rotation.x+=.002;this.core.rotation.y+=.003;}
    this.orbitNodes.forEach(n=>{n.userData.angle+=n.userData.speed*.01;n.position.x=Math.cos(n.userData.angle)*n.userData.radius;n.position.y=Math.sin(n.userData.angle*.6)*2;n.position.z=Math.sin(n.userData.angle)*n.userData.radius;});
    this.connections.forEach(p=>{p.userData.angle+=p.userData.speed*.01;p.position.x=Math.cos(p.userData.angle)*p.userData.orbitRadius;p.position.z=Math.sin(p.userData.angle)*p.userData.orbitRadius;p.position.y=p.userData.yOffset+Math.sin(t*p.userData.speed)*.5;p.material.opacity=.3+Math.sin(t*2+p.userData.angle)*.2;});
    this.camera.position.x+=(this.mouseX*2-this.camera.position.x)*.02;this.camera.position.y+=(this.mouseY*1.5-this.camera.position.y)*.02;this.camera.lookAt(0,0,0);
    this.renderer.render(this.scene,this.camera);
  }
  onResize(){this.camera.aspect=window.innerWidth/window.innerHeight;this.camera.updateProjectionMatrix();this.renderer.setSize(window.innerWidth,window.innerHeight);}
}

// Init
document.addEventListener('DOMContentLoaded',()=>{
  new ParticleSystem();
  new ThreeCore();
  // GSAP scroll animations
  if(typeof gsap!=='undefined'&&typeof ScrollTrigger!=='undefined'){
    gsap.registerPlugin(ScrollTrigger);
    setTimeout(()=>{
      gsap.utils.toArray('.glass-card').forEach((card,i)=>{gsap.from(card,{scrollTrigger:{trigger:card,start:'top 85%',toggleActions:'play none none none'},y:40,opacity:0,duration:.6,delay:i*.08,ease:'power2.out'});});
    },500);
  }
});
</script>
