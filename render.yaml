# Render 部署配置 — 一键部署后端(+静态前端页面)到 Render
# 部署后访问 Render 给的网址(如 https://xxx.onrender.com),前后端同源,完整可用。
# 点 README 里的 "Deploy to Render" 按钮即可,无需手动配置。
services:
  - type: web
    name: ai-career-copilot
    runtime: node
    plan: free
    branch: Jin-Ziyao
    buildCommand: pnpm install --frozen-lockfile --config.strict-peer-dependencies=false && pnpm --filter backend build
    startCommand: node backend/dist/server.js
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: LLM_MODE
        value: mock
      - key: NODE_ENV
        value: production
      # 如需接入真实 AI,在 Render 控制台添加 AI_API_KEY 环境变量,并把 LLM_MODE 改为 live

  - type: web
    name: ai-career-copilot-ui
    runtime: static
    branch: Jin-Ziyao
    buildCommand: mkdir -p static-dist && cp index.html student.html enterprise.html static-dist/ && cp -R css js static-dist/
    staticPublishPath: ./static-dist
    autoDeployTrigger: off
