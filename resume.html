<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 简历优化 — Keal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ==================== HEADER ==================== -->
<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo-link">
      <div class="logo-mark">K</div>
      AI Career Copilot
    </a>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">首页</a>
      <a href="resume.html" class="nav-link active">AI 简历</a>
      <a href="interview.html" class="nav-link">模拟面试</a>
    </nav>
    <div class="header-right">
      <div class="user-badge">
        <div class="user-avatar">K</div>
        你好，Kael 👋
      </div>
    </div>
  </div>
</header>

<!-- ==================== MAIN ==================== -->
<main class="main">

  <!-- Back link -->
  <div style="margin-bottom:20px;">
    <a href="index.html" style="font-size:13px;color:var(--text-tertiary);display:inline-flex;align-items:center;gap:4px;transition:color var(--duration-fast) var(--ease-out);" onmouseover="this.style.color='var(--accent-500)'" onmouseout="this.style.color='var(--text-tertiary)'">
      ← 返回首页
    </a>
  </div>

  <!-- Page Title -->
  <div style="margin-bottom:24px;">
    <h1 style="font-size:28px;font-weight:700;letter-spacing:-0.5px;margin-bottom:6px;">✍️ AI 简历优化</h1>
    <p style="font-size:14px;color:var(--text-tertiary);">输入你的原始经历，AI 自动优化为专业简历描述</p>
  </div>

  <!-- Resume Page Layout -->
  <div class="resume-page">

    <!-- LEFT: Input Panel -->
    <div class="resume-panel">
      <div class="panel-header">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        原始经历输入
      </div>
      <div class="panel-body">
        <div class="resume-input-area">
          <textarea
            id="resumeInput"
            placeholder="请在这里输入你的原始经历描述...

例如：
• 我负责学校公众号运营
• 在学生会做活动策划
• 参加过一个AI小程序开发比赛
"
          >我负责学校公众号运营，每周发布文章，也会做一些活动推广。</textarea>
        </div>
        <div class="resume-btn-row">
          <button class="btn-primary" id="optimizeBtn" onclick="optimizeResume()">
            ✨ AI 优化
          </button>
        </div>

        <!-- History -->
        <div class="resume-history" id="resumeHistory">
          <div style="font-size:12px;color:var(--text-tertiary);font-weight:500;margin-bottom:8px;">历史记录</div>
          <div class="resume-history-item" onclick="loadHistory(0)">
            <span>项目经历 - AI小程序开发比赛</span>
            <span style="color:var(--accent-500);">92%</span>
          </div>
          <div class="resume-history-item" onclick="loadHistory(1)">
            <span>社团经历 - 学生会活动策划</span>
            <span style="color:var(--accent-500);">88%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: AI Output Panel -->
    <div class="resume-panel" id="outputPanel">
      <div class="panel-header">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        AI 优化结果
      </div>
      <div class="panel-body">
        <div class="ai-output" id="aiOutput">
          <span style="color:var(--text-tertiary);">点击左侧「AI 优化」按钮查看结果...</span>
        </div>

        <!-- Score Display -->
        <div class="score-display" id="scoreDisplay" style="opacity:0;transition:opacity 0.5s var(--ease-out);">
          <!-- SVG for score ring -->
          <div class="score-circle">
            <svg viewBox="0 0 60 60">
              <defs>
                <linearGradient id="scoreGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#6366F1"/>
                  <stop offset="100%" stop-color="#A78BFA"/>
                </linearGradient>
              </defs>
              <circle class="bg-ring" cx="30" cy="30" r="26"/>
              <circle class="fill-ring" id="fillRing" cx="30" cy="30" r="26"
                stroke-dasharray="163.36"
                stroke-dashoffset="163.36"/>
            </svg>
            <span class="score-value" id="scoreValue">0</span>
          </div>
          <div>
            <div style="font-size:14px;font-weight:600;">简历评分</div>
            <div class="score-label">
              关键词覆盖 <span id="kwScore" style="color:var(--accent-500);">--</span><br>
              专业度 <span id="proScore" style="color:var(--accent-500);">--</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</main>

<script src="js/app.js"></script>
</body>
</html>
