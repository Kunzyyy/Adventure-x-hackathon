<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历模板构建器 - Keal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root {
  --bg: #f0f0f3;
  --card: #fff;
  --text: #1a1a1a;
  --muted: #888;
  --primary: #4A6CF7;
  --border: #e0e0e0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* Layout */
.builder {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ===== Left Panel: Editor ===== */
.editor {
  width: 420px;
  min-width: 420px;
  background: #fff;
  overflow-y: auto;
  padding: 20px;
  border-right: 1px solid #eee;
}
.editor h2 {
  font-size: 20px; font-weight: 700; margin-bottom: 20px;
  background: linear-gradient(135deg, #4A6CF7, #7B2FF7);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

.form-section { margin-bottom: 20px; }
.form-section h3 {
  font-size: 14px; font-weight: 600; color: #555;
  margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #f0f0f0;
}

.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.field input, .field textarea, .field select {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
  border-radius: 8px; font-size: 13px; font-family: inherit; outline: none;
  transition: border-color 0.15s;
}
.field input:focus, .field textarea:focus { border-color: var(--primary); }
.field textarea { resize: vertical; min-height: 60px; line-height: 1.6; }

.add-btn {
  padding: 8px 16px; border: 1.5px dashed #ccc; border-radius: 8px;
  background: transparent; color: var(--muted); font-size: 13px;
  cursor: pointer; width: 100%; transition: all 0.15s;
}
.add-btn:hover { border-color: var(--primary); color: var(--primary); }

.exp-item, .edu-item {
  background: #f8f9fa; border-radius: 10px; padding: 12px; margin-bottom: 10px;
  position: relative;
}
.exp-item .remove-btn, .edu-item .remove-btn {
  position: absolute; top: 8px; right: 8px;
  width: 24px; height: 24px; border-radius: 50%; border: none;
  background: #fee2e2; color: #dc2626; font-size: 14px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}

/* ===== Right Panel: Preview + Tabs ===== */
.preview-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #e8e8ec;
}

/* Template Tabs */
.tpl-tabs {
  display: flex; gap: 0; padding: 12px 20px; background: #fff;
  border-bottom: 1px solid #eee;
}
.tpl-tab {
  padding: 8px 16px; border: 1.5px solid var(--border); font-size: 13px;
  cursor: pointer; background: #fff; color: var(--muted);
  transition: all 0.15s;
}
.tpl-tab:first-child { border-radius: 8px 0 0 8px; }
.tpl-tab:last-child { border-radius: 0 8px 8px 0; }
.tpl-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

/* Toolbar */
.toolbar {
  display: flex; gap: 10px; padding: 12px 20px; background: #fff;
  border-bottom: 1px solid #eee; align-items: center;
}
.toolbar button {
  padding: 8px 18px; border-radius: 8px; border: none;
  font-size: 13px; font-weight: 600; cursor: pointer;
}
.btn-export { background: var(--primary); color: #fff; }
.btn-save { background: #f0f0f3; color: #555; }

/* Preview Area */
.preview {
  flex: 1; overflow-y: auto; padding: 30px;
  display: flex; justify-content: center;
}
.a4-page {
  width: 794px; min-height: 1123px; background: #fff;
  box-shadow: 0 4px 24px rgba(0,0,0,0.1);
  font-size: 12px; line-height: 1.7;
}

/* ======== Template 1: Classic ======== */
.tpl-1 { padding: 56px 64px; }
.tpl-1 .t1-header { text-align: center; margin-bottom: 32px; }
.tpl-1 .t1-header .name { font-size: 28px; font-weight: 700; letter-spacing: 4px; }
.tpl-1 .t1-header .info { font-size: 12px; color: #888; margin-top: 8px; }
.tpl-1 .t1-section { margin-bottom: 24px; }
.tpl-1 .t1-section h2 {
  font-size: 14px; font-weight: 700; text-transform: uppercase;
  border-bottom: 2px solid #1a1a1a; padding-bottom: 4px; margin-bottom: 12px;
  letter-spacing: 2px;
}
.tpl-1 .t1-exp { margin-bottom: 16px; }
.tpl-1 .t1-exp .t1-exp-head { display: flex; justify-content: space-between; font-weight: 700; }
.tpl-1 .t1-exp .t1-exp-role { color: #666; font-size: 11px; }
.tpl-1 .t1-exp .t1-exp-desc { font-size: 11px; color: #555; margin-top: 4px; }

/* ======== Template 2: Modern ======== */
.tpl-2 { display: flex; }
.tpl-2 .t2-sidebar { width: 220px; background: #1a1a2e; color: #e0e0e8; padding: 48px 28px; }
.tpl-2 .t2-sidebar .t2-name { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.tpl-2 .t2-sidebar .t2-title { font-size: 13px; color: #7B8AB8; margin-bottom: 28px; }
.tpl-2 .t2-sidebar .t2-sec { margin-bottom: 24px; }
.tpl-2 .t2-sidebar .t2-sec h3 { font-size: 12px; text-transform: uppercase; color: #7B8AB8; border-bottom: 1px solid #2a2a4e; padding-bottom: 4px; margin-bottom: 8px; letter-spacing: 1px; }
.tpl-2 .t2-sidebar .t2-sec p, .tpl-2 .t2-sidebar .t2-sec li { font-size: 11px; line-height: 1.8; list-style: none; }
.tpl-2 .t2-main { flex: 1; padding: 48px 40px; }
.tpl-2 .t2-main h2 { font-size: 14px; font-weight: 700; color: #1a1a2e; border-bottom: 2px solid #1a1a2e; padding-bottom: 4px; margin-bottom: 12px; }
.tpl-2 .t2-exp { margin-bottom: 16px; }
.tpl-2 .t2-exp .t2-exp-head { display: flex; justify-content: space-between; font-weight: 700; font-size: 13px; }
.tpl-2 .t2-exp .t2-exp-role { color: #666; font-size: 12px; font-style: italic; }
.tpl-2 .t2-exp .t2-exp-desc { font-size: 11px; color: #555; margin-top: 4px; }

/* ======== Template 3: Minimal ======== */
.tpl-3 { padding: 64px 72px; }
.tpl-3 .t3-header { margin-bottom: 36px; }
.tpl-3 .t3-header .t3-name { font-size: 32px; font-weight: 300; letter-spacing: 6px; }
.tpl-3 .t3-header .t3-info { font-size: 12px; color: #aaa; margin-top: 6px; letter-spacing: 1px; }
.tpl-3 .t3-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.tpl-3 .t3-sec { margin-bottom: 24px; }
.tpl-3 .t3-sec h2 { font-size: 11px; font-weight: 400; color: #aaa; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 12px; }
.tpl-3 .t3-sec p, .tpl-3 .t3-sec li { font-size: 12px; color: #444; line-height: 1.9; }

/* ======== Template 4: Blue Professional ======== */
.tpl-4 { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
.tpl-4 .t4-header { background: #1a3a5c; color: #fff; padding: 36px 48px; display: flex; justify-content: space-between; align-items: center; }
.tpl-4 .t4-header .t4-name { font-size: 28px; font-weight: 700; }
.tpl-4 .t4-header .t4-info { font-size: 11px; color: #bdd5e7; line-height: 1.8; }
.tpl-4 .t4-body { padding: 32px 48px; display: flex; gap: 32px; }
.tpl-4 .t4-col-main { flex: 1; }
.tpl-4 .t4-col-side { width: 200px; }
.tpl-4 .t4-sec { margin-bottom: 20px; }
.tpl-4 .t4-sec h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; color: #1a3a5c; border-bottom: 2px solid #1a3a5c; padding-bottom: 3px; margin-bottom: 10px; }
.tpl-4 .t4-exp { margin-bottom: 12px; }
.tpl-4 .t4-exp .t4-exp-head { display: flex; justify-content: space-between; font-weight: 700; font-size: 13px; }
.tpl-4 .t4-exp .t4-exp-role { color: #1a3a5c; font-size: 12px; font-weight: 600; }
.tpl-4 .t4-exp .t4-exp-desc { font-size: 12px; color: #555; margin-top: 4px; line-height: 1.7; }
.tpl-4 .t4-col-side .t4-sec h2 { font-size: 12px; }
.tpl-4 .t4-col-side .t4-edu-item { margin-bottom: 8px; }
.tpl-4 .t4-col-side .t4-edu-item .t4-school { font-weight: 700; font-size: 12px; }
.tpl-4 .t4-col-side .t4-edu-item .t4-detail { font-size: 11px; color: #777; }
.tpl-4 .t4-col-side .t4-skills { font-size: 11px; color: #555; line-height: 1.8; }
.tpl-4 .t4-col-side .t4-contact { font-size: 11px; color: #555; margin-bottom: 3px; }

/* Scrollbar */
.editor::-webkit-scrollbar, .preview::-webkit-scrollbar { width: 6px; }
.editor::-webkit-scrollbar-thumb, .preview::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

@media (max-width: 900px) {
  .builder { flex-direction: column; }
  .editor { width: 100%; min-width: auto; max-height: 40vh; }
  .a4-page { width: 100%; transform: scale(1); }
  .preview { padding: 10px; }
}
</style>
</head>
<body>

<div class="builder">
  <!-- ===== LEFT: Editor Form ===== -->
  <div class="editor" id="editor">
    <h2>📝 简历信息</h2>

    <div class="form-section">
      <h3>基本信息</h3>
      <div class="field"><label>姓名</label><input type="text" data-key="name" value="张同学"></div>
      <div class="field"><label>职位意向</label><input type="text" data-key="title" value="产品经理"></div>
      <div style="display:flex;gap:10px;">
        <div class="field" style="flex:1"><label>邮箱</label><input type="text" data-key="email" value="zhang@example.com"></div>
        <div class="field" style="flex:1"><label>电话</label><input type="text" data-key="phone" value="138-0000-0000"></div>
      </div>
      <div style="display:flex;gap:10px;">
        <div class="field" style="flex:1"><label>城市</label><input type="text" data-key="city" value="北京"></div>
        <div class="field" style="flex:1"><label>年龄</label><input type="text" data-key="age" value="22"></div>
      </div>
    </div>

    <div class="form-section">
      <h3>教育经历</h3>
      <div id="eduList"></div>
      <button class="add-btn" onclick="addEdu()">+ 添加教育经历</button>
    </div>

    <div class="form-section">
      <h3>工作/项目经历</h3>
      <div id="expList"></div>
      <button class="add-btn" onclick="addExp()">+ 添加经历</button>
    </div>

    <div class="form-section">
      <h3>技能</h3>
      <div class="field"><label>技能（逗号分隔）</label><input type="text" data-key="skills" value="产品设计, 数据分析, SQL, Python, Axure, 用户研究"></div>
    </div>

    <div class="form-section">
      <h3>自我评价</h3>
      <div class="field"><textarea data-key="eval" rows="4">5年互联网产品经验，擅长从0到1搭建产品体系，主导过3款百万级DAU产品。具备较强的数据分析能力和跨团队协作能力，能快速理解业务需求并转化为产品方案。</textarea></div>
    </div>
    <button class="add-btn" onclick="location.href='chat.html'">🤖 使用AI对话优化简历 →</button>
  </div>

  <!-- ===== RIGHT: Preview ===== -->
  <div class="preview-panel">
    <div class="tpl-tabs" id="templateTabs">
      <button class="tpl-tab active" data-tpl="1">经典模板</button>
      <button class="tpl-tab" data-tpl="2">现代简约</button>
      <button class="tpl-tab" data-tpl="3">极简风格</button>
      <button class="tpl-tab" data-tpl="4">商务蓝</button>
    </div>
    <div class="toolbar">
      <button class="btn-export" id="exportBtn">📥 导出 PDF</button>
      <button class="btn-save" onclick="saveToLocal()">💾 保存草稿</button>
    </div>
    <div class="preview">
      <div class="a4-page" id="a4page"></div>
    </div>
  </div>
</div>

<script>
// ===== Data =====
let resumeData = {
  name: '张同学', title: '产品经理',
  email: 'zhang@example.com', phone: '138-0000-0000',
  city: '北京', age: '22',
  education: [
    { school: 'XX大学', major: '计算机科学', degree: '本科', period: '2020 - 2024' }
  ],
  experience: [
    { company: 'XX科技有限公司', role: '产品实习生', period: '2023.06 - 2023.09',
      desc: '协助产品经理完成用户需求调研，整理并分析200+条用户反馈；独立完成产品原型设计3个功能模块；推动上线后用户满意度提升15%。' }
  ],
  skills: '产品设计, 数据分析, SQL, Python, Axure, 用户研究',
  eval: '具备良好的逻辑分析能力和沟通表达能力，善于从用户角度出发思考产品问题。学习能力强，能快速适应新领域。'
};

let currentTemplate = 1;

// ===== Render =====
function renderPreview() {
  const page = document.getElementById('a4page');
  const d = resumeData;
  const skillsArr = d.skills.split(/[,，、]/).map(s => s.trim()).filter(Boolean);

  if (currentTemplate === 1) {
    page.className = 'a4-page tpl-1';
    page.innerHTML = `
      <div class="t1-header">
        <div class="name">${d.name}</div>
        <div class="info">${d.title} | ${d.email} | ${d.phone} | ${d.city} · ${d.age}岁</div>
      </div>
      ${d.experience.length ? `<div class="t1-section"><h2>工作经历</h2>${d.experience.map(e=>`
        <div class="t1-exp">
          <div class="t1-exp-head"><span>${e.company}</span><span>${e.period}</span></div>
          <div class="t1-exp-role">${e.role}</div>
          <div class="t1-exp-desc">${e.desc}</div>
        </div>`).join('')}</div>` : ''}
      ${d.education.length ? `<div class="t1-section"><h2>教育背景</h2>${d.education.map(e=>`<p style="font-weight:700">${e.school} · ${e.major} · ${e.degree}<span style="float:right;font-weight:400;color:#888">${e.period}</span></p>`).join('')}</div>` : ''}
      <div class="t1-section"><h2>技能</h2><p style="color:#555;font-size:12px">${skillsArr.join(' · ')}</p></div>
      <div class="t1-section"><h2>自我评价</h2><p style="color:#555;font-size:12px">${d.eval}</p></div>
    `;
  } else if (currentTemplate === 2) {
    page.className = 'a4-page tpl-2';
    page.innerHTML = `
      <div class="t2-sidebar">
        <div class="t2-name">${d.name}</div>
        <div class="t2-title">${d.title}</div>
        <div class="t2-sec"><h3>联系方式</h3><p>${d.email}<br>${d.phone}<br>${d.city} · ${d.age}岁</p></div>
        <div class="t2-sec"><h3>技能</h3><ul>${skillsArr.map(s=>`<li>${s}</li>`).join('')}</ul></div>
        ${d.education.length ? `<div class="t2-sec"><h3>教育</h3>${d.education.map(e=>`<p><strong>${e.school}</strong><br>${e.major} · ${e.degree}<br>${e.period}</p>`).join('')}</div>` : ''}
      </div>
      <div class="t2-main">
        ${d.experience.length ? `<h2>工作经历</h2>${d.experience.map(e=>`<div class="t2-exp"><div class="t2-exp-head"><span>${e.company}</span><span>${e.period}</span></div><div class="t2-exp-role">${e.role}</div><div class="t2-exp-desc">${e.desc}</div></div>`).join('')}` : ''}
        <h2 style="margin-top:24px">自我评价</h2><p style="font-size:11px;color:#555;line-height:1.8">${d.eval}</p>
      </div>
    `;
  } else if (currentTemplate === 3) {
    page.className = 'a4-page tpl-3';
    page.innerHTML = `
      <div class="t3-header"><div class="t3-name">${d.name}</div><div class="t3-info">${d.title} · ${d.email} · ${d.phone}</div></div>
      <div class="t3-grid">
        <div>
          ${d.experience.length ? `<div class="t3-sec"><h2>经历</h2>${d.experience.map(e=>`<p style="margin-bottom:12px"><strong>${e.company}</strong> · ${e.role}<br><span style="color:#aaa">${e.period}</span><br>${e.desc}</p>`).join('')}</div>` : ''}
        </div>
        <div>
          ${d.education.length ? `<div class="t3-sec"><h2>教育</h2>${d.education.map(e=>`<p><strong>${e.school}</strong><br>${e.major} · ${e.degree}<br>${e.period}</p>`).join('')}</div>` : ''}
          <div class="t3-sec"><h2>技能</h2><p>${skillsArr.join(', ')}</p></div>
          <div class="t3-sec"><h2>关于</h2><p>${d.eval}</p></div>
        </div>
      </div>
    `;
  } else if (currentTemplate === 4) {
    page.className = 'a4-page tpl-4';
    page.innerHTML = `
      <div class="t4-header">
        <div>
          <div class="t4-name">${d.name}</div>
          <div style="font-size:14px;color:#bdd5e7;margin-top:4px">${d.title}</div>
        </div>
        <div class="t4-info">${d.email}<br>${d.phone}<br>${d.city} · ${d.age}岁</div>
      </div>
      <div class="t4-body">
        <div class="t4-col-main">
          ${d.experience.length ? `<div class="t4-sec"><h2>工作经历</h2>${d.experience.map(e=>`<div class="t4-exp"><div class="t4-exp-head"><span>${e.company}</span><span>${e.period}</span></div><div class="t4-exp-role">${e.role}</div><div class="t4-exp-desc">${e.desc}</div></div>`).join('')}</div>` : ''}
          <div class="t4-sec"><h2>自我评价</h2><p style="font-size:12px;color:#555;line-height:1.7">${d.eval}</p></div>
        </div>
        <div class="t4-col-side">
          ${d.education.length ? `<div class="t4-sec"><h2>教育背景</h2>${d.education.map(e=>`<div class="t4-edu-item"><div class="t4-school">${e.school}</div><div class="t4-detail">${e.major} · ${e.degree}<br>${e.period}</div></div>`).join('')}</div>` : ''}
          <div class="t4-sec"><h2>专业技能</h2><ul class="t4-skills">${skillsArr.map(s=>`<li>${s}</li>`).join('')}</ul></div>
        </div>
      </div>
    `;
  }
}

// ===== CRUD =====
function renderEduList() {
  const container = document.getElementById('eduList');
  container.innerHTML = resumeData.education.map((e, i) => `
    <div class="edu-item">
      <button class="remove-btn" onclick="removeEdu(${i})">×</button>
      <div class="field"><label>学校</label><input value="${e.school}" oninput="updateEdu(${i},'school',this.value)"></div>
      <div style="display:flex;gap:8px">
        <div class="field" style="flex:1"><label>专业</label><input value="${e.major}" oninput="updateEdu(${i},'major',this.value)"></div>
        <div class="field" style="flex:1"><label>学历</label><input value="${e.degree}" oninput="updateEdu(${i},'degree',this.value)"></div>
      </div>
      <div class="field"><label>时间</label><input value="${e.period}" oninput="updateEdu(${i},'period',this.value)"></div>
    </div>
  `).join('');
}
function renderExpList() {
  const container = document.getElementById('expList');
  container.innerHTML = resumeData.experience.map((e, i) => `
    <div class="exp-item">
      <button class="remove-btn" onclick="removeExp(${i})">×</button>
      <div class="field"><label>公司/组织</label><input value="${e.company}" oninput="updateExp(${i},'company',this.value)"></div>
      <div class="field"><label>职位/角色</label><input value="${e.role}" oninput="updateExp(${i},'role',this.value)"></div>
      <div class="field"><label>时间</label><input value="${e.period}" oninput="updateExp(${i},'period',this.value)"></div>
      <div class="field"><label>描述</label><textarea oninput="updateExp(${i},'desc',this.value)">${e.desc}</textarea></div>
    </div>
  `).join('');
}

function addEdu() { resumeData.education.push({ school:'', major:'', degree:'', period:'' }); renderEduList(); renderPreview(); }
function removeEdu(i) { resumeData.education.splice(i,1); renderEduList(); renderPreview(); }
function updateEdu(i,key,val) { resumeData.education[i][key]=val; renderPreview(); }
function addExp() { resumeData.experience.push({ company:'', role:'', period:'', desc:'' }); renderExpList(); renderPreview(); }
function removeExp(i) { resumeData.experience.splice(i,1); renderExpList(); renderPreview(); }
function updateExp(i,key,val) { resumeData.experience[i][key]=val; renderPreview(); }

// Bind simple fields
document.querySelectorAll('[data-key]').forEach(input => {
  input.addEventListener('input', () => {
    const key = input.dataset.key;
    if (['name','title','email','phone','city','age','skills','eval'].includes(key)) {
      resumeData[key] = input.value;
      renderPreview();
    }
  });
});

// Template switching
document.getElementById('templateTabs').addEventListener('click', e => {
  if (e.target.classList.contains('tpl-tab')) {
    document.querySelectorAll('.tpl-tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    currentTemplate = parseInt(e.target.dataset.tpl);
    renderPreview();
  }
});

// Export PDF
document.getElementById('exportBtn').addEventListener('click', () => {
  const page = document.getElementById('a4page');
  html2pdf().set({
    margin: 0,
    filename: resumeData.name + '_简历.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'px', format: [794, 1123], orientation: 'portrait' }
  }).from(page).save();
});

// Save to localStorage
function saveToLocal() {
  localStorage.setItem('resumeData', JSON.stringify(resumeData));
  alert('✅ 已保存草稿！');
}

// Load from localStorage
const saved = localStorage.getItem('resumeData');
if (saved) {
  try { resumeData = Object.assign(resumeData, JSON.parse(saved)); } catch(e) {}
}

renderEduList();
renderExpList();
document.querySelectorAll('[data-key]').forEach(input => {
  if (resumeData[input.dataset.key] !== undefined) input.value = resumeData[input.dataset.key];
});
renderPreview();
</script>
</body>
</html>
